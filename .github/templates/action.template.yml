name: "build {{pkg.name}}@{{pkg.version}} (riscv64)"
description: "Generated from {{recipe.dir}} by scripts/render.py - do not edit by hand."
# The name uses the publish target, so a fork that rewrites the scope (PUBLISH_SCOPE)
# shows the package it actually publishes.

# Two toolchains are supported, chosen per recipe by `toolchain:` in .stat:
#
#   native (default) - fetch/patch/build/test all run inside a riscv64 container
#     under qemu. Slower, but nothing is cross-compiled: the compiler itself runs
#     on the target CPU.
#   cross - fetch/patch/build run in an amd64 container carrying the riscv64 cross
#     toolchain (rustc + riscv64-linux-gnu gcc), and only the test step runs in the
#     riscv64 container, so the produced artifact is still exercised on its own CPU.
#     For a large Rust workspace this is minutes instead of hours.
#
# Override the images at run time with RISCV_IMAGE (build) and RISCV_TEST_IMAGE
# (test, defaults to RISCV_IMAGE). The images are pinned here on purpose: changing
# this template changes every recipe (see .dsh/plan.md D7).
#
# Containers run as the calling user (RISCV_DOCKER_USER overrides it) and get a
# workspace HOME. Running as root would leave root-owned files in the workspace,
# and the publish step - which runs on the host, without emulation - could not
# write the manifest it has to generate.

inputs:
  publish:
    description: "Publish the built packages to their registries"
    required: false
    default: "false"
  reuse:
    description: "The workspace tree was restored from the build cache: skip fetch, patch and build"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: prepare toolchain
      shell: bash
      run: |
        set -euo pipefail
        image="${RISCV_IMAGE:-{{build.image}}}"
        test_image="${RISCV_TEST_IMAGE:-${RISCV_IMAGE:-{{test.image}}}}"
        echo "build image: $image ({{build.platform}}) via {{job.toolchain}} toolchain"
        echo "test image: $test_image ({{test.platform}})"
        for one in "$image" "$test_image"; do
          if docker image inspect "$one" >/dev/null 2>&1; then
            continue
          fi
          echo "image not present locally, pulling $one"
          if ! docker pull "$one"; then
            echo "ERROR: cannot pull $one" >&2
            echo "Set RISCV_IMAGE / RISCV_TEST_IMAGE to reachable images (see the" >&2
            echo "toolchain-image workflow), or build them locally:" >&2
            echo "  docker build -f {{build.dockerfile}} -t {{build.image}} ." >&2
            exit 1
          fi
        done
        mkdir -p "$GITHUB_WORKSPACE/.container-home"
        docker run --rm --platform {{build.platform}} "$image" uname -m
{{#if job.cross}}
        # A cross toolchain has to prove it can target riscv64 before anything else
        # runs; the produced binary is checked again in the test step.
        docker run --rm --platform {{build.platform}} "$image" \
          sh -c 'rustc -V; riscv64-linux-gnu-gcc --version | head -1'
{{/if}}

    # A cache hit means the same inputs already produced this tree, so the three
    # steps that create it are skipped. The test step still runs: a restored
    # artifact has to be validated like a fresh one (D16).
    #
    # 1/5 - fetch: upstream > source > npm, falling through only on failure.
    - name: fetch upstream source
      if: inputs.reuse != 'true'
      shell: bash
      run: |
        set -euo pipefail
        image="${RISCV_IMAGE:-{{build.image}}}"
        docker run --rm --platform {{build.platform}} \
          --user "${RISCV_DOCKER_USER:-$(id -u):$(id -g)}" \
          -e HOME=/w/.container-home -e npm_config_cache=/w/.container-home/.npm \
          -v "$GITHUB_WORKSPACE:/w" -w /w \
          -e SRC_DIR={{src.dir}} -e TMP_DIR=.fetch-tmp \
          "$image" bash "/w/{{steps.dir}}/steps/fetch.sh"

{{#if has.patches}}
    # 2/5 - patch: the common layer first, then the version layer.
    - name: apply patches
      if: inputs.reuse != 'true'
      shell: bash
      run: |
        set -euo pipefail
        image="${RISCV_IMAGE:-{{build.image}}}"
        docker run --rm --platform {{build.platform}} \
          --user "${RISCV_DOCKER_USER:-$(id -u):$(id -g)}" \
          -e HOME=/w/.container-home -e npm_config_cache=/w/.container-home/.npm \
          -v "$GITHUB_WORKSPACE:/w" -w /w \
          -e SRC_DIR={{src.dir}} \
          "$image" bash "/w/{{steps.dir}}/steps/patch.sh"
{{/if}}

    # 3/5 - build
    - name: build
      if: inputs.reuse != 'true'
      shell: bash
      run: |
        set -euo pipefail
        image="${RISCV_IMAGE:-{{build.image}}}"
        docker run --rm --platform {{build.platform}} \
          --user "${RISCV_DOCKER_USER:-$(id -u):$(id -g)}" \
          -e HOME=/w/.container-home -e npm_config_cache=/w/.container-home/.npm \
          -v "$GITHUB_WORKSPACE:/w" -w "/w/{{src.dir}}/{{upstream.subdir}}" \
          -e SRC_DIR={{src.dir}} \
{{#if job.cross}}
          -e RISCV_TARGET={{riscv.triple}} \
{{/if}}
          "$image" bash "/w/{{steps.dir}}/steps/build.sh"

    # 4/5 - test: runs on the target CPU even for a cross recipe, and also asserts
    # the artifact really is a RISC-V object.
    - name: test
      shell: bash
      run: |
        set -euo pipefail
        image="${RISCV_TEST_IMAGE:-${RISCV_IMAGE:-{{test.image}}}}"
        docker run --rm --platform {{test.platform}} \
          --user "${RISCV_DOCKER_USER:-$(id -u):$(id -g)}" \
          -e HOME=/w/.container-home -e npm_config_cache=/w/.container-home/.npm \
          -v "$GITHUB_WORKSPACE:/w" -w "/w/{{src.dir}}/{{upstream.subdir}}" \
          -e SRC_DIR={{src.dir}} \
          "$image" bash "/w/{{steps.dir}}/steps/test.sh"

    # 5/5 - publish: runs on the host, no emulation needed to move files and
    # talk to a registry.
    - name: publish
      if: inputs.publish == 'true'
      shell: bash
      run: |
        set -euo pipefail
        bash "{{steps.dir}}/steps/publish.sh"
