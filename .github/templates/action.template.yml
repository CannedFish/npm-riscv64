name: "build {{pkg.name}}@{{pkg.version}} (riscv64)"
description: "Generated from {{recipe.dir}} by scripts/render.py - do not edit by hand."
# The name uses the publish target, so a fork that rewrites the scope (PUBLISH_SCOPE)
# shows the package it actually publishes.

# The riscv64 container is pinned here on purpose: changing this template changes
# every recipe, and a template change forces a full rebuild (see .dsh/plan.md D7).
# Override the image at run time with the RISCV_IMAGE environment variable.
#
# Containers run as the calling user (RISCV_DOCKER_USER overrides it) and get a
# workspace HOME. Running as root would leave root-owned files in the workspace,
# and the publish step - which runs on the host, without emulation - could not
# write the manifest it has to generate.

inputs:
  publish:
    description: "Publish the built packages to their registries"
    required: false
    default: "false"
  reuse:
    description: "The workspace tree was restored from the build cache: skip fetch, patch and build"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: prepare riscv64 emulation
      shell: bash
      run: |
        set -euo pipefail
        image="${RISCV_IMAGE:-npm-riscv64/toolchain:riscv64}"
        echo "riscv image: $image"
        if ! docker image inspect "$image" >/dev/null 2>&1; then
          echo "image not present locally, pulling $image"
          if ! docker pull "$image"; then
            echo "ERROR: cannot pull $image" >&2
            echo "Set RISCV_IMAGE to a reachable image (see the toolchain-image workflow)," >&2
            echo "or build it locally:" >&2
            echo "  docker build -f docker/riscv64-toolchain.Dockerfile -t npm-riscv64/toolchain:riscv64 ." >&2
            exit 1
          fi
        fi
        mkdir -p "$GITHUB_WORKSPACE/.container-home"
        docker run --rm --platform linux/riscv64 "$image" uname -m

    # A cache hit means the same inputs already produced this tree, so the three
    # steps that create it are skipped. The test step still runs: a restored
    # artifact has to be validated like a fresh one (D16).
    #
    # 1/5 - fetch: upstream > source > npm, falling through only on failure.
    - name: fetch upstream source
      if: inputs.reuse != 'true'
      shell: bash
      run: |
        set -euo pipefail
        image="${RISCV_IMAGE:-npm-riscv64/toolchain:riscv64}"
        docker run --rm --platform linux/riscv64 \
          --user "${RISCV_DOCKER_USER:-$(id -u):$(id -g)}" \
          -e HOME=/w/.container-home -e npm_config_cache=/w/.container-home/.npm \
          -v "$GITHUB_WORKSPACE:/w" -w /w \
          -e SRC_DIR={{src.dir}} -e TMP_DIR=.fetch-tmp \
          "$image" bash "/w/{{steps.dir}}/steps/fetch.sh"

{{#if has.patches}}
    # 2/5 - patch: the common layer first, then the version layer.
    - name: apply patches
      if: inputs.reuse != 'true'
      shell: bash
      run: |
        set -euo pipefail
        image="${RISCV_IMAGE:-npm-riscv64/toolchain:riscv64}"
        docker run --rm --platform linux/riscv64 \
          --user "${RISCV_DOCKER_USER:-$(id -u):$(id -g)}" \
          -e HOME=/w/.container-home -e npm_config_cache=/w/.container-home/.npm \
          -v "$GITHUB_WORKSPACE:/w" -w /w \
          -e SRC_DIR={{src.dir}} \
          "$image" bash "/w/{{steps.dir}}/steps/patch.sh"
{{/if}}

    # 3/5 - build
    - name: build
      if: inputs.reuse != 'true'
      shell: bash
      run: |
        set -euo pipefail
        image="${RISCV_IMAGE:-npm-riscv64/toolchain:riscv64}"
        docker run --rm --platform linux/riscv64 \
          --user "${RISCV_DOCKER_USER:-$(id -u):$(id -g)}" \
          -e HOME=/w/.container-home -e npm_config_cache=/w/.container-home/.npm \
          -v "$GITHUB_WORKSPACE:/w" -w "/w/{{src.dir}}/{{upstream.subdir}}" \
          -e SRC_DIR={{src.dir}} \
          "$image" bash "/w/{{steps.dir}}/steps/build.sh"

    # 4/5 - test: also asserts the artifact really is a RISC-V object.
    - name: test
      shell: bash
      run: |
        set -euo pipefail
        image="${RISCV_IMAGE:-npm-riscv64/toolchain:riscv64}"
        docker run --rm --platform linux/riscv64 \
          --user "${RISCV_DOCKER_USER:-$(id -u):$(id -g)}" \
          -e HOME=/w/.container-home -e npm_config_cache=/w/.container-home/.npm \
          -v "$GITHUB_WORKSPACE:/w" -w "/w/{{src.dir}}/{{upstream.subdir}}" \
          -e SRC_DIR={{src.dir}} \
          "$image" bash "/w/{{steps.dir}}/steps/test.sh"

    # 5/5 - publish: runs on the host, no emulation needed to move files and
    # talk to a registry.
    - name: publish
      if: inputs.publish == 'true'
      shell: bash
      run: |
        set -euo pipefail
        bash "{{steps.dir}}/steps/publish.sh"
